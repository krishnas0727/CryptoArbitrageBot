<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>📊 Live Prices - Crypto Arbitrage Bot</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<aside class="sidebar">

    <div class="logo">
        ₿ Crypto Arbitrage
    </div>

    <nav>

        <a href="/">
            🏠 Dashboard
        </a>

        <a href="/prices" class="active">
            📊 Live Prices
        </a>

        <a href="/arbitrage">
            ⚡ Arbitrage
        </a>

        <a href="/trades">
            🔄 Trade History
        </a>

        <a href="/settings">
            ⚙ Settings
        </a>

    </nav>

    <div class="bot-status">
        <span class="dot"></span>
        <span>Bot Online</span>
    </div>

</aside>


<main class="main">

    <header>

        <div>

            <h1>Live Prices</h1>

            <p>
                Real-time BTC / USDT prices
            </p>

        </div>

        <div id="time">
            --:--:--
        </div>

    </header>


    <section class="cards">

        <div class="card">

            <span>Binance</span>

            <h2 id="binance">
                --
            </h2>

            <small>
                BTC / USDT
            </small>

        </div>


        <div class="card">

            <span>Bybit</span>

            <h2 id="bybit">
                --
            </h2>

            <small>
                BTC / USDT
            </small>

        </div>


        <div class="card">

            <span>Coinbase</span>

            <h2 id="coinbase">
                --
            </h2>

            <small>
                BTC / USDT
            </small>

        </div>

    </section>

    <!-- LIVE CHART PANEL -->
    <section class="panel" style="margin-top:24px;">
        <div class="panel-title" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h2>📈 Real-Time Price Chart</h2>
                <p>Live ticker updates across exchanges</p>
            </div>
            <span style="font-size:12px; color:#22c55e; background:#132b20; padding:4px 10px; border-radius:12px; border:1px solid #1e5a3b;">
                ● LIVE
            </span>
        </div>
        <div style="position:relative; height:320px; width:100%; margin-top:15px;">
            <canvas id="pricesPageChart"></canvas>
        </div>
    </section>

</main>


<script>

let pricesChart = null;
let pricesHistory = {
    labels: [],
    binance: [],
    bybit: [],
    coinbase: []
};

function updateTime() {

    document.getElementById("time").innerText =
        new Date().toLocaleTimeString();

}

updateTime();

setInterval(updateTime, 1000);


function initPricesChart() {
    const ctx = document.getElementById('pricesPageChart');
    if (!ctx || typeof Chart === 'undefined') return;

    try {
        pricesChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: pricesHistory.labels,
                datasets: [
                    {
                        label: 'Binance',
                        data: pricesHistory.binance,
                        borderColor: '#3b82f6',
                        borderWidth: 2,
                        tension: 0.2,
                        fill: false
                    },
                    {
                        label: 'Bybit',
                        data: pricesHistory.bybit,
                        borderColor: '#eab308',
                        borderWidth: 2,
                        tension: 0.2,
                        fill: false
                    },
                    {
                        label: 'Coinbase',
                        data: pricesHistory.coinbase,
                        borderColor: '#06b6d4',
                        borderWidth: 2,
                        tension: 0.2,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } }
                },
                plugins: { legend: { labels: { color: '#cbd5e1' } } }
            }
        });
    } catch(e) {}
}

async function loadPrices() {

    try {

        const response =
            await fetch("/api/market");

        const result =
            await response.json();

        if (!result.success) return;

        const data =
            result.data;


        if (data.prices.Binance) {
            document.getElementById("binance").innerText = Number(data.prices.Binance).toFixed(2);
        }

        if (data.prices.Bybit) {
            document.getElementById("bybit").innerText = Number(data.prices.Bybit).toFixed(2);
        }

        if (data.prices.Coinbase || data.prices.Kraken) {
            document.getElementById("coinbase").innerText = Number(data.prices.Coinbase || data.prices.Kraken).toFixed(2);
        }

        if (data.prices) {
            const timeStr = new Date().toLocaleTimeString();
            pricesHistory.labels.push(timeStr);
            pricesHistory.binance.push(data.prices.Binance || null);
            pricesHistory.bybit.push(data.prices.Bybit || null);
            pricesHistory.coinbase.push(data.prices.Coinbase || data.prices.Kraken || null);

            if (pricesHistory.labels.length > 30) {
                pricesHistory.labels.shift();
                pricesHistory.binance.shift();
                pricesHistory.bybit.shift();
                pricesHistory.coinbase.shift();
            }

            if (!pricesChart) {
                initPricesChart();
            } else {
                pricesChart.update('none');
            }
        }

    }

    catch (error) {

        console.error(error);

    }

}


loadPrices();

setInterval(loadPrices, 5000);

</script>

</body>

</html>
